name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar icones do app
        run: |
          pip install pillow
          python tools/gerar_icones.py

      - name: Codigo nativo do alarme (voz, toque, tela cheia)
        run: python tools/aplicar_nativo.py

      - name: Usar a mesma chave de assinatura sempre (permite atualizar o app sem desinstalar)
        run: |
          mkdir -p ~/.android
          cp assinatura/debug.keystore ~/.android/debug.keystore

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AgendaArretada.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AgendaArretada-apk
          path: AgendaArretada.apk

      - name: Publicar para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" AgendaArretada.apk \
            --title "Agenda Arretada v${{ github.run_number }}" \
            --notes "Baixe o AgendaArretada.apk e instale no Android."
